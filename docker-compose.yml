# Локальный PostgreSQL под DATABASE_URL из server/.env (postgres/postgres/postgres на порту 5432).
services:
  db:
    image: postgres:16-alpine
    container_name: my-app-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - my_app_pgdata:/var/lib/postgresql/data

volumes:
  my_app_pgdata:
